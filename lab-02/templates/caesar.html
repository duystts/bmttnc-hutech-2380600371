<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-5">
        <table class="table">
            <tr><td style="text-align: center; font-weight: bold; font-size: 25px;">CAESAR CIPHER</td></tr>
            <tr><td style="font-weight: bold; color: blue">ENCRYPTION</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/encrypt" id="encryptForm">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" id="inputPlainText" placeholder="Input Plain Text" required autofocus/>
                            <div class="text-danger small mt-1" id="plainError"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control" name="inputKeyPlain" id="inputKeyPlain" placeholder="Input Key (1-25)" required/>
                            <div class="text-danger small mt-1" id="keyPlainError"></div>
                        </div>
                        <button type="submit" class="btn btn-primary" id="btnEncrypt">Encrypt</button>
                    </form>
                </td>
            </tr>

            <tr><td style="font-weight: bold; color: blue">DECRYPTION</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/decrypt" id="decryptForm">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" id="inputCipherText" placeholder="Input Cipher Text" required/>
                            <div class="text-danger small mt-1" id="cipherError"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control" name="inputKeyCipher" id="inputKeyCipher" placeholder="Input Key (1-25)" required/>
                            <div class="text-danger small mt-1" id="keyCipherError"></div>
                        </div>
                        <button type="submit" class="btn btn-success" id="btnDecrypt">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>

    <script>
        const plainInput = document.getElementById('inputPlainText');
        const keyPlainInput = document.getElementById('inputKeyPlain');
        const cipherInput = document.getElementById('inputCipherText');
        const keyCipherInput = document.getElementById('inputKeyCipher');

        const plainError = document.getElementById('plainError');
        const keyPlainError = document.getElementById('keyPlainError');
        const cipherError = document.getElementById('cipherError');
        const keyCipherError = document.getElementById('keyCipherError');

        const btnEncrypt = document.getElementById('btnEncrypt');
        const btnDecrypt = document.getElementById('btnDecrypt');

        function validateText(value, errorElement, inputElement) {
            if (!value) {
                errorElement.textContent = "Bản rõ/Bản mã không được để trống.";
                inputElement.classList.add('is-invalid');
                return false;
            }
            if (!/^[a-zA-Z]+$/.test(value)) {
                errorElement.textContent = "Chỉ chấp nhận chữ cái (A-Z). Không được chứa số, khoảng trắng hoặc ký tự đặc biệt.";
                inputElement.classList.add('is-invalid');
                return false;
            }
            errorElement.textContent = "";
            inputElement.classList.remove('is-invalid');
            return true;
        }

        function validateKey(value, errorElement, inputElement) {
            if (!value) {
                errorElement.textContent = "Key không được để trống.";
                inputElement.classList.add('is-invalid');
                return false;
            }
            const num = Number(value);
            if (!Number.isInteger(num)) {
                errorElement.textContent = "Key phải là số nguyên.";
                inputElement.classList.add('is-invalid');
                return false;
            }
            if (num < 1 || num > 25) {
                errorElement.textContent = "Key phải là số nguyên từ 1 đến 25.";
                inputElement.classList.add('is-invalid');
                return false;
            }
            errorElement.textContent = "";
            inputElement.classList.remove('is-invalid');
            return true;
        }

        function checkEncryptValidity() {
            const isTextValid = validateText(plainInput.value, plainError, plainInput);
            const isKeyValid = validateKey(keyPlainInput.value, keyPlainError, keyPlainInput);
            btnEncrypt.disabled = !(isTextValid && isKeyValid);
        }

        function checkDecryptValidity() {
            const isTextValid = validateText(cipherInput.value, cipherError, cipherInput);
            const isKeyValid = validateKey(keyCipherInput.value, keyCipherError, keyCipherInput);
            btnDecrypt.disabled = !(isTextValid && isKeyValid);
        }

        plainInput.addEventListener('input', checkEncryptValidity);
        keyPlainInput.addEventListener('input', checkEncryptValidity);
        cipherInput.addEventListener('input', checkDecryptValidity);
        keyCipherInput.addEventListener('input', checkDecryptValidity);

        // Initial validation on load (but don't style as invalid immediately if empty)
        document.addEventListener('DOMContentLoaded', () => {
            btnEncrypt.disabled = true;
            btnDecrypt.disabled = true;
        });
    </script>
</body>
</html>
